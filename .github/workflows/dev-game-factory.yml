name: dev_game Factory QA

on:
  push:
    branches: [main]
    paths:
      - 'dev_game/**'
      - 'skills/**'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'scripts/**'
      - '.github/workflows/dev-game-factory.yml'
  pull_request:
    paths:
      - 'dev_game/**'
      - 'skills/**'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'scripts/**'
      - '.github/workflows/dev-game-factory.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check skill topology (single source + symlinks)
        run: |
          ./scripts/check_skill_drift.sh --skip-user \
            || { echo '::error::skill topology broken — skills/ is the single source; .claude/skills and .agents/skills must be symlinks to it. Run scripts/install_game_factory_skill.sh repo'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check skill documents early (fast-fail before the heavy setup)
        run: |
          # 새 커버리지가 아니다 — factory:qa가 이 넷을 이미 체인으로 부른다.
          # 다만 그때는 npm install과 Playwright 설치를 지난 뒤라 2분쯤 걸리고,
          # 실패해도 긴 체인 어디서 죽었는지 이름이 남지 않는다. 여기서 먼저
          # 돌려 문서/게이트 결함이면 몇 초 만에, 원인이 적힌 채로 실패시킨다.
          # 이 넷은 하위 프로세스도 브라우저도 npm install도 필요 없다.
          node scripts/check_skill_commands.mjs \
            || { echo '::error::스킬 문서의 명령·플래그가 실제 CLI 계약과 어긋난다'; exit 1; }
          node scripts/check_cli_parity.mjs \
            || { echo '::error::공유 검증기와 leaf 파서의 수용/거부 또는 오류 코드가 갈라졌다'; exit 1; }
          node scripts/check_skill_gate_controls.mjs \
            || { echo '::error::skill_task_gate 대조군이 기대대로 동작하지 않는다'; exit 1; }
          node scripts/skill_task_gate_qa.mjs \
            || { echo '::error::skill_task_gate 결함 주입 QA 실패'; exit 1; }
      - name: Install dev_game tooling
        run: npm --prefix dev_game install
      - name: Install Playwright Chromium
        run: npm --prefix dev_game exec playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (imagegen integrity QA uses the same verifier deps as generation)
        run: python -m pip install Pillow PyYAML
      - name: Run factory QA
        run: npm --prefix dev_game run factory:qa

  curated-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: factory-qa
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game:
          - bullseye-rush
          - castle-archer
          - jungle-arcshot
          - market-panic
          - meteor-dash
          - night-market-wok
          - keeper-last-light
          - last-minute-keeper
          - parcel-sort-rush
          - road-stream-racer
          - rush-lane-racer
          - sky-archer
          - target-shooter-rush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            dev_game/package-lock.json
            dev_game/generated/${{ matrix.game }}/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          npm --prefix dev_game ci
          npm --prefix "dev_game/generated/${{ matrix.game }}" ci
          python -m pip install Pillow PyYAML
      - name: Build runtime allowlist
        run: npm --prefix "dev_game/generated/${{ matrix.game }}" run build
      - name: Verify runtime file-set, SHA and budget
        run: |
          GAME="dev_game/generated/${{ matrix.game }}"
          # production-gate.mjs와 같은 판단을 쓴다: assetLayout 마커가 없으면 그 게임은
          # 런타임 배송 롤아웃을 도입한 적이 없고 이 게이트는 해당되지 않는다.
          # 게이트는 건너뛰는데 CI만 하드 실패하면 계약이 두 개가 된다.
          if node -e "process.exit(require('./$GAME/assets/asset-manifest.json').assetLayout ? 0 : 1)"; then
            npm --prefix dev_game run factory:dist-runtime-qa -- --project "generated/${{ matrix.game }}"
          elif [ -f "$GAME/scripts/runtime-asset-delivery.mjs" ]; then
            # 조용한 skip은 위험하다 — 마커를 잃은 롤아웃 게임까지 통과시킨다.
            # 배선이 남아 있는데 마커만 없으면 legacy가 아니라 회귀다.
            echo "::error::${{ matrix.game }}: runtime-delivery 배선은 있는데 assetLayout 마커가 없다 — 롤아웃이 회귀했다"
            exit 1
          else
            echo "::notice::${{ matrix.game }}: legacy 배송(assetLayout 마커 없음) — 런타임 배송 게이트 해당없음"
          fi
      - name: Verify production manifest and image quality
        run: |
          npm --prefix dev_game run factory:production-demo-qa -- --project "generated/${{ matrix.game }}" --require-gpt-imagegen
          npm --prefix dev_game run factory:image-quality-qa -- --project "generated/${{ matrix.game }}"
          npm --prefix dev_game run factory:hq-screen-quality-qa -- --project "generated/${{ matrix.game }}" --skip-market-events
      - name: Install Chromium for the physics-bounds run
        # qa:physics-bounds는 실제 브라우저를 띄운다. 이 잡은 지금껏 브라우저를
        # 설치한 적이 없어서 "Executable doesn't exist"로 죽었다 — 게임 결함이 아니라
        # 잡이 의존성을 빠뜨린 것이다. 필요한 게임에서만 설치해 나머지 12개는 빠르게 둔다.
        if: matrix.game == 'rush-lane-racer'
        run: npm --prefix dev_game exec playwright install --with-deps chromium
      - name: Verify Rush Lane Racer physics bounds
        if: matrix.game == 'rush-lane-racer'
        run: npm --prefix "dev_game/generated/${{ matrix.game }}" run qa:physics-bounds

  curated-full-production-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [factory-qa, curated-runtime-qa]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { game: bullseye-rush, port: 4310 }
          - { game: jungle-arcshot, port: 4320 }
          - { game: road-stream-racer, port: 4330 }
          - { game: castle-archer, port: 4340 }
          - { game: parcel-sort-rush, port: 4350 }
          - { game: target-shooter-rush, port: 4360 }
          - { game: market-panic, port: 4370 }
          - { game: meteor-dash, port: 4380 }
          - { game: night-market-wok, port: 4385 }
          - { game: keeper-last-light, port: 4387 }
          - { game: last-minute-keeper, port: 4389 }
          - { game: rush-lane-racer, port: 4390 }
          - { game: sky-archer, port: 4400 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            dev_game/package-lock.json
            dev_game/generated/${{ matrix.game }}/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-gate dependencies
        run: |
          npm --prefix dev_game ci
          npm --prefix "dev_game/generated/${{ matrix.game }}" ci
          npm --prefix dev_game exec playwright install --with-deps chromium
          python -m pip install Pillow PyYAML
      - name: Run full production gate
        run: >-
          npm --prefix dev_game run factory:production-gate --
          --skip-foundation
          --project "generated/${{ matrix.game }}"
          --require-gpt-imagegen
          --port "${{ matrix.port }}"
          --viewports 390x844,430x932,1080x1920
