name: dev_game Factory QA

on:
  push:
    branches: [main]
    paths:
      - 'dev_game/**'
      - 'skills/**'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'scripts/install_game_factory_skill.sh'
      - 'scripts/check_skill_drift.sh'
      - 'scripts/check_doc_constants.mjs'
      - '.github/workflows/dev-game-factory.yml'
  pull_request:
    paths:
      - 'dev_game/**'
      - 'skills/**'
      - '.claude/skills/**'
      - '.agents/skills/**'
      - 'scripts/install_game_factory_skill.sh'
      - 'scripts/check_skill_drift.sh'
      - 'scripts/check_doc_constants.mjs'
      - '.github/workflows/dev-game-factory.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: '영수증을 발급할 게임 id (dev_game/generated/<id>). 비우면 QA만 돈다.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  factory-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check skill topology (single source + symlinks)
        run: |
          ./scripts/check_skill_drift.sh --skip-user \
            || { echo '::error::skill topology broken — skills/ is the single source; .claude/skills and .agents/skills must be symlinks to it. Run scripts/install_game_factory_skill.sh repo'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dev_game tooling
        run: npm --prefix dev_game install
      - name: Install Playwright Chromium
        run: npm --prefix dev_game exec playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (imagegen integrity QA uses the same verifier deps as generation)
        run: python -m pip install Pillow
      - name: Run factory QA
        run: npm --prefix dev_game run factory:qa

  issue-pass-receipt:
    # PASS 영수증 발급. 비밀키는 이 잡에만 있고 로컬에는 없다 — 그래서 "게이트를 돌렸다"는
    # 주장을 CI만 발급할 수 있다. 지문은 공개 해시라 서명 없이는 손으로 쓴 영수증과
    # 게이트가 낸 영수증을 구별할 방법이 없다.
    #
    # 켜는 방법:
    #   1. ed25519 키쌍 생성
    #        openssl genpkey -algorithm ed25519 -out signing.pem
    #        openssl pkey -in signing.pem -pubout -out dev_game/docs/qa-evidence/receipt-signing-public.pem
    #   2. signing.pem 내용을 저장소 시크릿 RECEIPT_SIGNING_KEY 로 등록하고 로컬 파일은 파기
    #   3. 공개키를 커밋 — 그 순간부터 무서명 영수증은 invalid 다
    #
    # 주의: 3단계는 **기존 영수증을 전부 무효화한다.** 이 잡이 다시 발급해야 한다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.game != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dev_game tooling
        run: npm --prefix dev_game install
      - name: Install Playwright Chromium
        run: npm --prefix dev_game exec playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Run the production gate
        run: |
          npm --prefix dev_game run factory:production-gate -- \
            --project "dev_game/generated/${{ inputs.game }}" \
            --require-gpt-imagegen \
            --viewports 390x844,430x932,1080x1920
      - name: Sign the receipt
        env:
          RECEIPT_SIGNING_KEY: ${{ secrets.RECEIPT_SIGNING_KEY }}
        run: |
          test -n "$RECEIPT_SIGNING_KEY" || {
            echo '::error::RECEIPT_SIGNING_KEY secret is not set — see the comment on this job'; exit 1; }
          npm --prefix dev_game run factory:sign-pass-receipt -- \
            --receipt "dev_game/docs/qa-evidence/${{ inputs.game }}-production-pass.json"
      - name: Verify the signed receipt
        run: npm --prefix dev_game run factory:production-pass-status -- --project "dev_game/generated/${{ inputs.game }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pass-receipt-${{ inputs.game }}
          path: dev_game/docs/qa-evidence/${{ inputs.game }}-production-pass.json

  curated-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: factory-qa
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game:
          - bullseye-rush
          - castle-archer
          - jungle-arcshot
          - market-panic
          - meteor-dash
          - night-market-wok
          - keeper-last-light
          - last-minute-keeper
          - parcel-sort-rush
          - road-stream-racer
          - rush-lane-racer
          - sky-archer
          - target-shooter-rush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            dev_game/package-lock.json
            dev_game/generated/${{ matrix.game }}/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          npm --prefix dev_game ci
          npm --prefix "dev_game/generated/${{ matrix.game }}" ci
          python -m pip install Pillow
      - name: Build runtime allowlist
        run: npm --prefix "dev_game/generated/${{ matrix.game }}" run build
      - name: Verify runtime file-set, SHA and budget
        run: npm --prefix dev_game run factory:dist-runtime-qa -- --project "generated/${{ matrix.game }}"
      - name: Verify production manifest and image quality
        run: |
          npm --prefix dev_game run factory:production-demo-qa -- --project "generated/${{ matrix.game }}" --require-gpt-imagegen
          npm --prefix dev_game run factory:image-quality-qa -- --project "generated/${{ matrix.game }}"
          npm --prefix dev_game run factory:hq-screen-quality-qa -- --project "generated/${{ matrix.game }}" --skip-market-events
      - name: Verify Rush Lane Racer physics bounds
        if: matrix.game == 'rush-lane-racer'
        run: npm --prefix "dev_game/generated/${{ matrix.game }}" run qa:physics-bounds

  curated-full-production-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [factory-qa, curated-runtime-qa]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { game: bullseye-rush, port: 4310 }
          - { game: jungle-arcshot, port: 4320 }
          - { game: road-stream-racer, port: 4330 }
          - { game: castle-archer, port: 4340 }
          - { game: parcel-sort-rush, port: 4350 }
          - { game: target-shooter-rush, port: 4360 }
          - { game: market-panic, port: 4370 }
          - { game: meteor-dash, port: 4380 }
          - { game: night-market-wok, port: 4385 }
          - { game: keeper-last-light, port: 4387 }
          - { game: last-minute-keeper, port: 4389 }
          - { game: rush-lane-racer, port: 4390 }
          - { game: sky-archer, port: 4400 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            dev_game/package-lock.json
            dev_game/generated/${{ matrix.game }}/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-gate dependencies
        run: |
          npm --prefix dev_game ci
          npm --prefix "dev_game/generated/${{ matrix.game }}" ci
          npm --prefix dev_game exec playwright install --with-deps chromium
          python -m pip install Pillow
      - name: Run full production gate
        run: >-
          npm --prefix dev_game run factory:production-gate --
          --skip-foundation
          --project "generated/${{ matrix.game }}"
          --require-gpt-imagegen
          --port "${{ matrix.port }}"
          --viewports 390x844,430x932,1080x1920
