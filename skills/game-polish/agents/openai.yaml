interface:
  display_name: "Game Polish"
  short_description: "Post-production fix loop for a game past its first production-demo PASS: symptom → defect class → fix → re-capture"
  default_prompt: "Use $game-polish to run a post-production fix pass on a generated game that has already passed its first production-demo gate. Translate every reported or capture-found symptom into a defect class from dev_game/docs/post-production-qa-contract.md, reproduce it under the original conditions, fix per the class rules, re-capture under the same repro conditions with a machine-assertable state-sample JSON, and re-run production gates. Never downgrade a capture-found defect to a known gap. Before that first PASS, and for new games or new features on an existing one, route to game-factory."
